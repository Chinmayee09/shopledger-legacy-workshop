<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1010" viewBox="0 0 1440 1010" role="img" aria-labelledby="title desc">
  <title id="title">ShopLedger architecture</title>
  <desc id="desc">The browser UI calls Express routes, which use ShopLedger library modules, configuration, and the JSON data store. The highlighted order route flow resolves products, validates stock and coupons, calculates totals, updates Khata, deducts stock, records the order, and writes the database.</desc>
  <style>
    text { font-family: Arial, sans-serif; fill: #172033; }
    .title { font-size: 26px; font-weight: 700; }
    .subtitle { font-size: 14px; fill: #52627a; }
    .group { fill: #f7f9fc; stroke: #c7d2e2; stroke-width: 2; rx: 16; }
    .box { fill: #fff; stroke: #7b8ba4; stroke-width: 1.5; rx: 8; }
    .flow { fill: #e8f4ff; stroke: #3174b9; stroke-width: 2; rx: 8; }
    .data { fill: #fff3d6; stroke: #bb7c18; stroke-width: 2; rx: 8; }
    .label { font-size: 15px; font-weight: 700; }
    .body { font-size: 13px; }
    .small { font-size: 12px; fill: #52627a; }
    .arrow { stroke: #65758d; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    .flowarrow { stroke: #1670bb; stroke-width: 3; fill: none; marker-end: url(#bluearrow); }
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#65758d"/></marker>
    <marker id="bluearrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#1670bb"/></marker>
  </defs>

  <text x="48" y="48" class="title">ShopLedger architecture</text>
  <text x="48" y="74" class="subtitle">Existing modules and the order-placement path</text>

  <rect x="48" y="108" width="260" height="160" class="group"/>
  <text x="70" y="140" class="label">Browser</text>
  <rect x="70" y="158" width="216" height="78" class="flow"/>
  <text x="88" y="187" class="label">public/</text>
  <text x="88" y="208" class="body">index.html Â· js/app.js Â· css/style.css</text>

  <rect x="374" y="108" width="316" height="340" class="group"/>
  <text x="396" y="140" class="label">Express application</text>
  <rect x="396" y="158" width="272" height="58" class="box"/>
  <text x="414" y="185" class="label">server.js</text>
  <text x="414" y="204" class="small">middleware, static files, invoice page</text>
  <rect x="396" y="238" width="126" height="64" class="box"/>
  <text x="410" y="264" class="label">routes/</text><text x="410" y="285" class="small">products.js</text>
  <rect x="542" y="238" width="126" height="64" class="flow"/>
  <text x="557" y="264" class="label">routes/</text><text x="557" y="285" class="small">orders.js</text>
  <rect x="396" y="324" width="126" height="64" class="box"/>
  <text x="410" y="350" class="label">routes/</text><text x="410" y="371" class="small">customers.js</text>
  <rect x="542" y="324" width="126" height="64" class="box"/>
  <text x="557" y="350" class="label">routes/</text><text x="557" y="371" class="small">reports.js</text>

  <rect x="758" y="108" width="410" height="580" class="group"/>
  <text x="780" y="140" class="label">Domain modules in lib/</text>
  <rect x="780" y="158" width="176" height="60" class="flow"/><text x="796" y="184" class="label">inventory.js</text><text x="796" y="204" class="small">stock checks and deductions</text>
  <rect x="974" y="158" width="172" height="60" class="flow"/><text x="990" y="184" class="label">pricing.js</text><text x="990" y="204" class="small">subtotal and totals</text>
  <rect x="780" y="238" width="176" height="60" class="flow"/><text x="796" y="264" class="label">coupons.js</text><text x="796" y="284" class="small">coupon validation</text>
  <rect x="974" y="238" width="172" height="60" class="flow"/><text x="990" y="264" class="label">tax.js</text><text x="990" y="284" class="small">HSN GST rates</text>
  <rect x="780" y="318" width="176" height="60" class="flow"/><text x="796" y="344" class="label">ledger.js</text><text x="796" y="364" class="small">Khata credits/settlements</text>
  <rect x="974" y="318" width="172" height="60" class="flow"/><text x="990" y="344" class="label">orders.js</text><text x="990" y="364" class="small">order records/cancellation</text>
  <rect x="780" y="398" width="176" height="60" class="box"/><text x="796" y="424" class="label">invoice.js</text><text x="796" y="444" class="small">printable invoice</text>
  <rect x="974" y="398" width="172" height="60" class="box"/><text x="990" y="424" class="label">reports.js</text><text x="990" y="444" class="small">dashboard/reconciliation</text>
  <rect x="780" y="478" width="176" height="60" class="box"/><text x="796" y="504" class="label">dates.js</text><text x="796" y="524" class="small">date helpers</text>
  <rect x="974" y="478" width="172" height="60" class="flow"/><text x="990" y="504" class="label">store.js</text><text x="990" y="524" class="small">read/write/audit log</text>

  <rect x="1232" y="108" width="160" height="160" class="group"/>
  <text x="1250" y="140" class="label">Configuration</text>
  <rect x="1250" y="158" width="124" height="58" class="data"/><text x="1266" y="184" class="label">config.js</text><text x="1266" y="204" class="small">shop, GST, coupons</text>
  <rect x="1232" y="314" width="160" height="134" class="group"/>
  <text x="1250" y="346" class="label">Persistence</text>
  <rect x="1250" y="364" width="124" height="58" class="data"/><text x="1266" y="390" class="label">data/</text><text x="1266" y="410" class="small">db.json</text>

  <path d="M286 197 H396" class="arrow"/><text x="323" y="185" class="small">/api</text>
  <path d="M532 187 H758" class="arrow"/>
  <path d="M668 270 H758" class="flowarrow"/>
  <path d="M1146 188 H1250" class="arrow"/>
  <path d="M1146 508 H1210 V393 H1250" class="arrow"/>
  <path d="M956 508 H974" class="arrow"/>

  <rect x="48" y="742" width="1344" height="214" class="group"/>
  <text x="70" y="776" class="label">Order placement flow: POST /api/orders</text>
  <rect x="72" y="804" width="140" height="76" class="flow"/><text x="88" y="834" class="label">UI cart</text><text x="88" y="854" class="small">items, coupon, payment</text>
  <rect x="246" y="804" width="164" height="76" class="flow"/><text x="262" y="834" class="label">orders route</text><text x="262" y="854" class="small">resolve products</text>
  <rect x="444" y="804" width="164" height="76" class="flow"/><text x="460" y="830" class="label">inventory.js</text><text x="460" y="850" class="small">check stock</text><text x="460" y="868" class="small">then reserve</text>
  <rect x="642" y="804" width="164" height="76" class="flow"/><text x="658" y="830" class="label">coupons.js</text><text x="658" y="850" class="small">pricing.js Â· tax.js</text><text x="658" y="868" class="small">validate and total</text>
  <rect x="840" y="804" width="164" height="76" class="flow"/><text x="856" y="830" class="label">ledger.js</text><text x="856" y="850" class="small">Khata credit check</text><text x="856" y="868" class="small">when applicable</text>
  <rect x="1038" y="804" width="150" height="76" class="flow"/><text x="1054" y="830" class="label">orders.js</text><text x="1054" y="850" class="small">add order</text><text x="1054" y="868" class="small">nextOrderId</text>
  <rect x="1222" y="804" width="146" height="76" class="data"/><text x="1238" y="830" class="label">store.js</text><text x="1238" y="850" class="small">audit + write</text><text x="1238" y="868" class="small">data/db.json</text>
  <path d="M212 842 H246 M410 842 H444 M608 842 H642 M806 842 H840 M1004 842 H1038 M1188 842 H1222" class="flowarrow"/>
</svg>

